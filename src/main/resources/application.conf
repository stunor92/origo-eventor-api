ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [no.stunor.origo.eventorapi.ApplicationKt.module]
    }
}

app {
    supabaseUrl = "http://127.0.0.1:54321"
    supabaseUrl = ${?SUPABASE_URL}

    database {
        url = "jdbc:postgresql://127.0.0.1:54322/postgres"
        url = ${?POSTGRES_DB}
        username = "postgres"
        username = ${?POSTGRES_USER}
        password = "postgres"
        password = ${?POSTGRES_PASSWORD}
        maximumPoolSize = 20
        minimumIdle = 5
        connectionTimeout = 30000
        idleTimeout = 600000
        maxLifetime = 1800000
        leakDetectionThreshold = 60000
    }

    eventor {
        maxConcurrentRequests = 10
        requestTimeoutMs = 20000
        batchTimeoutMs = 20000
        batchTimeoutMs = ${?BATCH_TIMEOUT_MS}
    }

    cache {
        eventListTtlMinutes = 30
        competitorCountTtlMinutes = 30
        eventClassesTtlMinutes = 30
        organisationEntriesTtlMinutes = 5
    }
}
